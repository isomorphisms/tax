name: Vendor Title 26

on:
  push:
    paths:
      - .github/workflows/vendor-title-26.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official Title 26 XML
        run: |
          chmod +x get_code
          ./get_code 119-102

      - name: Commit official snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add code.xml SOURCE.md SHA256SUMS
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Mirror Title 26 through Public Law 119-102 [skip ci]"
          git push
